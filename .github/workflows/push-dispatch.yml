name: Push dispatch

# Vercel Hobby only allows once-per-day crons, and a reminder queued for 9am
# cannot wait until tomorrow. Actions runs the same endpoint on the cadence the
# dispatcher was written for. Schedules here drift a few minutes under load —
# fine, since /api/push-dispatch sends everything whose triggerAt has passed.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

# A late run and a fresh run would send the same rows twice.
concurrency:
  group: push-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send due notifications
        env:
          URL: ${{ secrets.PUSH_DISPATCH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ]; then
            echo "PUSH_DISPATCH_URL is not set; nothing to dispatch."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL"
